<body class="bg-slate-50 text-slate-800 font-sans">

  <script>

  <!-- Hero (Extracted) -->
  <!-- Hero Personalizado para Galería -->
  <div
    class="relative w-full pt-44 pb-32 md:pt-48 md:pb-40 bg-[url('images/Banner_1.webp')] bg-fixed bg-center bg-cover overflow-hidden group">
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#166534]/50 via-[#166534]/60 to-[#166534]/95"></div>
    <!-- Decorative Pattern -->
    <div class="absolute inset-0 opacity-10"
      style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM22.485 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 22.485l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 22.485l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 54.627l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 54.627l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM54.627 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828zM22.485 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828z\' fill=\'%23ffffff\' fill-rule=\'evenodd\'/%3E%3C/svg%3E');">

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16">

        Un vistazo a nuestras actividades, reuniones y momentos.
      </p>
    </section>

    <!-- GALERÍA DINÁMICA -->
    <section data-aos="fade-up">
      <div id="galeria" class="w-full columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 space-y-4">

        <div class="h-48 bg-slate-200 rounded-3xl animate-pulse shadow-md mb-4 inline-block w-full hidden sm:block">
        </div>
        <div class="h-80 bg-slate-200 rounded-3xl animate-pulse shadow-md mb-4 inline-block w-full hidden md:block">
        </div>
        <div class="h-56 bg-slate-200 rounded-3xl animate-pulse shadow-md mb-4 inline-block w-full hidden lg:block">
        </div>
      </div>
    </section>

  </main>

  <!-- Footer Placeholder -->
  <div id="main-footer"></div>

  <!-- Datos de Galería (Eliminado, ahora se usa Supabase) -->
  <!-- <script src="js/galeria-data.js"></script> -->

  <!-- SCRIPTS FINALES -->
  <script type="module">
    import { supabase } from './js/supabase-client.js';

    // Función principal para cargar la galería
    async function loadGallery() {
      const contenedor = document.getElementById("galeria");
      if (!contenedor) return;

      // Update container to be a Masonry Layout
      contenedor.className = 'w-full columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 space-y-4';

      try {
        // Consultar Supabase
        const { data: images, error } = await supabase
          .from('gallery_images')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // Renderizar imágenes
        if (images && images.length > 0) {
          let html = '';
          images.forEach(item => {
            // Data mapping
            const title = item.title || 'Sin Título';
            const imageUrl = item.image_url || '';
            const description = item.description || '';
            const isVideoMatch = imageUrl.match(/\\.(mp4|webm|ogg|mov)$/i);
            const isVideo = Boolean(isVideoMatch);
            const videoType = isVideoMatch ? `video/${isVideoMatch[1].toLowerCase()}` : 'video/mp4';
            const isYouTube = Boolean(imageUrl.includes('youtube.com') || imageUrl.includes('youtu.be'));

            let itemMarkup = '';
            // Determine video config for lightgallery based on type
            let videoDataAttr = '';
            let ytImg = '';
            if (isVideo) {
              videoDataAttr = `data-video='{"source": [{"src":"${imageUrl}", "type":"${videoType}"}], "attributes": {"preload": false, "controls": true}}'`;
            } else if (isYouTube) {
              // for youtube, lightgallery usually can figure it out from the href, but we can also use data-src
              videoDataAttr = `data-src="${imageUrl}"`;
              let ytId = imageUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
              ytImg = ytId ? `https://img.youtube.com/vi/${ytId[1]}/hqdefault.jpg` : imageUrl;
            } else {
              videoDataAttr = `href="${imageUrl}"`;
            }

            const thumbnailImg = (isYouTube && ytImg) ? ytImg : (isVideo ? `${imageUrl}#t=0.1` : imageUrl);
            const mediaTag = (isVideo && !isYouTube)
              ? `<video src="${thumbnailImg}" class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out" muted playsinline></video>`
              : `<img src="${thumbnailImg}" alt="${title}" class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out" loading="lazy">`;

            const iconHtml = isYouTube
              ? `<i class="fa-brands fa-youtube text-red-600 text-5xl opacity-90 group-hover:opacity-100 transition-transform transform group-hover:scale-110 drop-shadow-lg bg-white/30 rounded-full"></i>`
              : (isVideo ? `<i class="fa-solid fa-play text-white text-4xl opacity-80 group-hover:opacity-100 transition-transform transform group-hover:scale-110 drop-shadow-lg"></i>` : ``);

            itemMarkup = `
            <a ${videoDataAttr} ${isVideo && !isYouTube ? `data-poster=""` /* optional for lg-video */ : ''}
                 class="group relative block w-full mb-4 rounded-2xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-500 cursor-pointer isolate bg-slate-50"
                 data-sub-html="<h4 class='font-bold text-lg mb-1'>${title}</h4>${description ? `<p class='text-sm opacity-90'>${description}</p>` : ''}">
                 
                ${mediaTag}
                
                ${iconHtml ? `
                <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                  ${iconHtml}
                </div>` : ''}

                <!-- Subtle Overlay Gradient -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-20 pointer-events-none rounded-2xl">
                  <div class="absolute bottom-0 left-0 right-0 p-5 translate-y-2 group-hover:translate-y-0 transition-transform duration-500">
                    <p class="text-white font-bold text-sm md:text-base leading-tight drop-shadow-md">${title}</p>
                    ${description ? `<p class="text-white/80 text-xs mt-1.5 line-clamp-2 drop-shadow-sm font-medium">${description}</p>` : ''}
                  </div>
                </div>
            </a>
            `;
            html += itemMarkup;
          });
          contenedor.innerHTML = html;

          // Iniciar LightGallery
          lightGallery(contenedor, {
            selector: 'a',
            download: false,
            zoom: true,
            thumbnail: true,
            animateThumb: true,
            showThumbByDefault: false,
            speed: 500,
            plugins: [lgZoom, lgThumbnail, lgVideo]
          });

        } else {
          contenedor.innerHTML = '<p class="text-slate-500 text-center col-span-full py-10">No hay imágenes disponibles en la galería por el momento.</p>';
        }

      } catch (err) {
        console.error("Error cargando galería:", err);
        contenedor.innerHTML = '<p class="text-red-500 text-center col-span-full py-10">Hubo un error al cargar las imágenes. Por favor intenta nuevamente.</p>';
      }
    }

    // Ejecutar al cargar
    loadGallery();
  </script>

</body>

</html>
