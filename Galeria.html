<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Fotos - Feria Agrícola Melipilla | Actividades</title>
  <meta name="description"
    content="Explora nuestra galería de imágenes. Revive los mejores momentos, eventos y actividades de la Feria Agrícola Melipilla.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="shortcut icon" href="images/favicon.webp" type="image/x-icon">
  <meta name="theme-color" content="#166534">

  <!-- LightGallery (carrusel) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/thumbnail/lg-thumbnail.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#166534',
            secondary: '#65a30d',
            accent: '#f97316',
            dark: '#020617'
          },
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- AOS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <!-- Iconos -->
  <script src="https://kit.fontawesome.com/c38e3367c6.js" crossorigin="anonymous"></script>

  <!-- Layout Script -->
  <script src="js/layout.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AOS.init({ duration: 800, once: true, offset: 80 });
      renderLayout("Galería");
    });
  </script>

  <!-- Header Placeholder -->
  <div id="main-header"></div>

  <!-- Hero (Extracted) -->
  <div class="bg-primary text-white border-b border-emerald-700/80">
    <div class="max-w-6xl mx-auto px-4 py-10 md:py-14">
      <div data-aos="fade-right" class="space-y-3">
        <p class="text-xs tracking-[0.25em] uppercase text-emerald-200 font-semibold">Feria Agrícola Melipilla</p>
        <h1 class="text-3xl md:text-4xl font-bold">Galería</h1>
        <p class="text-sm md:text-base text-emerald-100 max-w-xl">Explora los mejores momentos y actividades.</p>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16">

    <section data-aos="fade-up" class="space-y-4">
      <h2 class="text-2xl md:text-3xl font-semibold text-slate-900 text-center">Galería de Imágenes</h2>
      <p class="text-sm md:text-base text-slate-700 text-center max-w-2xl mx-auto">
        Un vistazo a nuestras actividades, reuniones y momentos.
      </p>
    </section>

    <!-- GALERÍA -->
    <section data-aos="fade-up">
      <div id="galeria" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

        <a href="images/Banner_1.webp">
          <img src="images/Banner_1.webp"
            class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>

        <a href="images/Banner_2.webp">
          <img src="images/Banner_2.webp"
            class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>

        <a href="images/Banner_3.webp">
          <img src="images/Banner_3.webp"
            class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>

        <a href="images/Banner_4.webp">
          <img src="images/Banner_4.webp"
            class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>

        <a href="images/luis.webp">
          <img src="images/luis.webp" class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>

        <a href="images/ana.webp">
          <img src="images/ana.webp" class="w-full h-56 rounded-xl shadow-md object-cover hover:scale-105 transition">
        </a>
      </div>
    </section>

  </main>

  <!-- Footer Placeholder -->
  <div id="main-footer"></div>

  <!-- SCRIPTS FINALES -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // LightGallery
      const galeria = document.getElementById("galeria");
      if (galeria) {
        lightGallery(galeria, {
          selector: 'a',
          download: false,
          zoom: true,
          thumbnail: true,
          animateThumb: true,
          showThumbByDefault: true
        });
      }
    });
  </script>

</body>

</html>
