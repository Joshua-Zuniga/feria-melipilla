<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Fotos - Feria Agrícola Melipilla | Actividades</title>
  <meta name="description"
    content="Explora nuestra galería de imágenes. Revive los mejores momentos, eventos y actividades de la Feria Agrícola Melipilla.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="shortcut icon" href="images/favicon.webp" type="image/x-icon">
  <meta name="theme-color" content="#166534">

  <!-- LightGallery (carrusel) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/plugins/video/lg-video.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#166534',
            secondary: '#65a30d',
            accent: '#f97316',
            dark: '#020617'
          },
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- AOS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <!-- Iconos -->
  <script src="https://kit.fontawesome.com/c38e3367c6.js" crossorigin="anonymous"></script>

  <!-- Layout Script -->
  <script src="js/layout.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AOS.init({ duration: 800, once: true, offset: 80 });
      renderLayout("Galería");
    });
  </script>

  <!-- Header Placeholder -->
  <div id="main-header"></div>

  <!-- Hero (Extracted) -->
  <!-- Hero Personalizado para Galería -->
  <div class="relative w-full pt-40 pb-32 md:pt-48 md:pb-40 bg-[#166534] overflow-hidden group">
    <div class="absolute inset-0">
      <img src="images/Banner_1.webp"
        class="w-full h-full object-cover opacity-60 group-hover:opacity-70 transition-opacity duration-1000 scale-105 group-hover:scale-100">
      <div class="absolute inset-0 bg-gradient-to-t from-[#166534] via-[#166534]/50 to-[#166534]/30"></div>
      <div class="absolute inset-0 opacity-10"
        style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM22.485 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 22.485l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 22.485l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 54.627l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 54.627l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM54.627 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828zM22.485 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828z\' fill=\'%23ffffff\' fill-rule=\'evenodd\'/%3E%3C/svg%3E');">
      </div>
    </div>
    <div class="relative max-w-6xl mx-auto px-6 text-center z-10 space-y-4 mt-24 md:mt-0">
      <span
        class="inline-block py-1 px-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-emerald-200 text-xs font-bold uppercase tracking-widest animate-fade-in-up">
        En Imágenes
      </span>
      <h1 class="text-3xl md:text-6xl font-black text-white leading-tight drop-shadow-lg" data-aos="fade-up">
        Galería Fotográfica
      </h1>
      <p class="text-lg text-emerald-100 max-w-2xl mx-auto leading-relaxed" data-aos="fade-up" data-aos-delay="100">
        Un recorrido visual por la vida, eventos y colores de nuestra feria.
      </p>
    </div>
  </div>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16">

    <section data-aos="fade-up" class="space-y-4">
      <h2 class="text-2xl md:text-3xl font-semibold text-slate-900 text-center">Galería de Imágenes</h2>
      <p class="text-sm md:text-base text-slate-700 text-center max-w-2xl mx-auto">
        Un vistazo a nuestras actividades, reuniones y momentos.
      </p>
    </section>

    <!-- GALERÍA DINÁMICA -->
    <section data-aos="fade-up">
      <div id="galeria" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <!-- SKELETON LOADERS (Se eliminan al cargar JS) -->
        <div class="h-64 bg-slate-200 rounded-xl animate-pulse shadow-md"></div>
        <div class="h-64 bg-slate-200 rounded-xl animate-pulse shadow-md hidden sm:block"></div>
        <div class="h-64 bg-slate-200 rounded-xl animate-pulse shadow-md hidden md:block"></div>
      </div>
    </section>

  </main>

  <!-- Footer Placeholder -->
  <div id="main-footer"></div>

  <!-- Datos de Galería (Eliminado, ahora se usa Supabase) -->
  <!-- <script src="js/galeria-data.js"></script> -->

  <!-- SCRIPTS FINALES -->
  <script type="module">
    import { supabase } from './js/supabase-client.js';

    // Función principal para cargar la galería
    async function loadGallery() {
      const contenedor = document.getElementById("galeria");
      if (!contenedor) return;

      try {
        // Consultar Supabase
        const { data: images, error } = await supabase
          .from('gallery_images')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // Renderizar imágenes
        if (images && images.length > 0) {
          let html = '';
          images.forEach(item => {
            // Data mapping
            const title = item.title || 'Sin Título';
            const imageUrl = item.image_url || '';
            const description = item.description || '';
            const isVideoMatch = imageUrl.match(/\\.(mp4|webm|ogg|mov)$/i);
            const isVideo = Boolean(isVideoMatch);
            const videoType = isVideoMatch ? `video/${isVideoMatch[1].toLowerCase()}` : 'video/mp4';
            const isYouTube = Boolean(imageUrl.includes('youtube.com') || imageUrl.includes('youtu.be'));

            let itemMarkup = '';
            if (isVideo) {
              itemMarkup = `
              <a data-video='{"source": [{"src":"${imageUrl}", "type":"${videoType}"}], "attributes": {"preload": false, "controls": true}}'
                 class="group relative block w-full h-64 rounded-xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 hover-card-effect cursor-pointer"
                 data-sub-html="<h4>${title}</h4><p>${description}</p>">
                 
                <video src="${imageUrl}#t=0.1" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" muted playsinline></video>
                <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                  <i class="fa-solid fa-play text-white text-5xl opacity-80 group-hover:opacity-100 transition-opacity drop-shadow-lg"></i>
                </div>
                <!-- Overlay Hover -->
                <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors z-20 pointer-events-none">
                  <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                    <p class="text-white font-semibold text-sm truncate">${title}</p>
                    ${description ? `<p class="text-gray-200 text-xs truncate mt-1">${description}</p>` : ''}
                  </div>
                </div>
              </a>
              `;
            } else if (isYouTube) {
              let ytId = imageUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
              let ytImg = ytId ? `https://img.youtube.com/vi/${ytId[1]}/hqdefault.jpg` : imageUrl;
              itemMarkup = `
              <a href="${imageUrl}"
                 class="group relative block w-full h-64 rounded-xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 hover-card-effect cursor-pointer"
                 data-sub-html="<h4>${title}</h4><p>${description}</p>">
                 
                <img src="${ytImg}" alt="${title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" loading="lazy">
                <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                  <i class="fa-brands fa-youtube text-red-600 text-6xl opacity-90 group-hover:opacity-100 transition-opacity drop-shadow-lg bg-white/30 rounded-full"></i>
                </div>
                <!-- Overlay Hover -->
                <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors z-20 pointer-events-none">
                  <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                    <p class="text-white font-semibold text-sm truncate">${title}</p>
                    ${description ? `<p class="text-gray-200 text-xs truncate mt-1">${description}</p>` : ''}
                  </div>
                </div>
              </a>
              `;
            } else {
              itemMarkup = `
              <a href="${imageUrl}" 
                 class="group relative block w-full h-64 rounded-xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 hover-card-effect cursor-pointer"
                 data-sub-html="<h4>${title}</h4><p>${description}</p>">
                 
                <img src="${imageUrl}" alt="${title}" 
                     class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" loading="lazy">
                
                <!-- Overlay Hover -->
                <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors z-20 pointer-events-none">
                  <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                    <p class="text-white font-semibold text-sm truncate">${title}</p>
                    ${description ? `<p class="text-gray-200 text-xs truncate mt-1">${description}</p>` : ''}
                  </div>
                </div>
              </a>
              `;
            }
            html += itemMarkup;
          });
          contenedor.innerHTML = html;

          // Iniciar LightGallery
          lightGallery(contenedor, {
            selector: 'a',
            download: false,
            zoom: true,
            thumbnail: true,
            animateThumb: true,
            showThumbByDefault: false,
            speed: 500,
            plugins: [lgZoom, lgThumbnail, lgVideo]
          });

        } else {
          contenedor.innerHTML = '<p class="text-slate-500 text-center col-span-full py-10">No hay imágenes disponibles en la galería por el momento.</p>';
        }

      } catch (err) {
        console.error("Error cargando galería:", err);
        contenedor.innerHTML = '<p class="text-red-500 text-center col-span-full py-10">Hubo un error al cargar las imágenes. Por favor intenta nuevamente.</p>';
      }
    }

    // Ejecutar al cargar
    loadGallery();
  </script>

</body>

</html>
