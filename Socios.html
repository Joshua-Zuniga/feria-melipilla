<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Socios - Feria Agrícola Melipilla | Directorio Completo</title>
  <meta name="description"
    content="Busca y encuentra a los socios de la Feria Agrícola Melipilla. Descubre quiénes son los productores que dan vida a nuestra feria.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="images/favicon.webp" type="image/x-icon">
  <meta name="theme-color" content="#166534">

  <!-- Tailwind CSS con tema personalizado -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#166534',
            secondary: '#65a30d',
            accent: '#f97316',
            dark: '#020617'
          },
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],

      }

  <!-- AOS Animations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <!-- Iconos -->
  <script src="https://kit.fontawesome.com/c38e3367c6.js" crossorigin="anonymous"></script>
  <script src="js/layout.js"></script>

</head>

<body class="bg-slate-50 text-slate-800 font-sans">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 800, once: true, offset: 80 });
      renderLayout("Socios");
    });
  </script>

  <!-- Header Placeholder -->
  <div id="main-header"></div>

  <!-- Hero Personalizado para Socios -->
  <div
    class="relative w-full pt-44 pb-32 md:pt-48 md:pb-40 bg-[url('images/Banner_1.webp')] bg-fixed bg-center bg-cover overflow-hidden group">
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#166534]/50 via-[#166534]/60 to-[#166534]/95"></div>
    <!-- Decorative Pattern -->
    <div class="absolute inset-0 opacity-10"
      style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM22.485 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 22.485l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 22.485l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 54.627l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 54.627l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM54.627 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828zM22.485 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828z\' fill=\'%23ffffff\' fill-rule=\'evenodd\'/%3E%3C/svg%3E');">
    </div>

    <!-- Content -->
    <div class="relative max-w-6xl mx-auto px-6 text-center z-10 space-y-4 mt-24 md:mt-0">
      <span
        class="inline-block py-1 px-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-emerald-200 text-xs font-bold uppercase tracking-widest animate-fade-in-up">
        Nuestros Feriantes
      </span>
      <h1 class="text-3xl md:text-6xl font-black text-white leading-tight drop-shadow-lg" data-aos="fade-up">
        Socios y Locales
      </h1>
      <p class="text-lg text-emerald-100 max-w-2xl mx-auto leading-relaxed" data-aos="fade-up" data-aos-delay="100">
        Descubre los puestos y productos de nuestros asociados.
      </p>
    </div>

    <!-- Wave Divider -->
    <div class="absolute bottom-0 left-0 w-full overflow-hidden leading-none z-20">
      <svg class="relative block w-full h-[50px] md:h-[100px]" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path
          d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,155.45,116.88,230.15,97.77Z"
          fill="#f8fafc"></path>
      </svg>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16">

    <section data-aos="fade-up">
      <!-- Buscador de socios -->
      <div class="mb-10 max-w-lg mx-auto md:mx-0">
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none z-10">
            <i
              class="fa-solid fa-magnifying-glass text-slate-400 group-focus-within:text-primary transition-colors"></i>
          </div>
          <input id="buscadorSocios" type="text" oninput="filtrarSocios()"
            class="peer w-full pl-12 pr-4 pt-6 pb-2 rounded-xl border-2 border-slate-200 focus:border-primary focus:ring-4 focus:ring-emerald-50 outline-none transition-all placeholder-transparent bg-slate-50 focus:bg-white text-slate-800 font-medium"
            placeholder=" " />
          <label for="buscadorSocios"
            class="absolute left-12 top-4 text-slate-400 text-sm transition-all transform -translate-y-3 scale-75 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-primary font-medium pointer-events-none">
            Buscar socio por nombre
          </label>
        </div>
      </div>

      <!-- Contenedor Dinámico de Socios -->
      <div id="socios-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
        <!-- Loading State -->
        <div class="col-span-full text-center py-20">
          <i class="fas fa-spinner fa-spin text-4xl text-emerald-600 mb-4"></i>
          <p class="text-slate-500 animate-pulse">Cargando socios...</p>
        </div>
      </div>

    </section>
  </main>


  <div id="main-footer"></div>

  <!-- Script Lógica Socios -->
  <script type="module">
    import { supabase } from './js/supabase-client.js';

    // Función auxiliar para obtener el "Primer Apellido" (estimado)
    function getSurname(fullName) {
      if (!fullName) return '';
      const parts = fullName.trim().split(/\s+/);
      // Case 1: "Name Surname" -> Surname
      if (parts.length <= 2) return parts[parts.length - 1];
      // Case 2: "Name Surname1 Surname2" (3) -> Surname1 (index 1)
      // Case 3: "Name Name Surname1 Surname2" (4) -> Surname1 (index 2)
      // Case 4: "Name del Name Surname1 Surname2" (5) -> Surname1 (index 3)
      return parts[parts.length - 2];
    }

    async function fetchAndRenderSocios() {
      const grid = document.getElementById('socios-grid');

      try {
        const { data: members, error } = await supabase
          .from('members')
          .select('id, name, profile_image')
          .eq('is_active', true);

        if (error) throw error;

        if (!members || members.length === 0) {
          grid.innerHTML = '<div class="col-span-full text-center text-slate-500">No se encontraron socios registrados.</div>';
          return;
        }

        // Ordenar por Apellido
        members.sort((a, b) => {
          const surA = getSurname(a.name).toLowerCase();
          const surB = getSurname(b.name).toLowerCase();
          return surA.localeCompare(surB);
        });

        // Renderizar
        grid.innerHTML = '';
        members.forEach((member, index) => {
          const firstLetter = member.name.charAt(0).toUpperCase();

          // Card HTML
          const card = document.createElement('a');
          card.href = `perfil.html?id=${member.id}`;
          card.className = 'tarjeta-socio bg-white border border-slate-100 rounded-3xl p-6 md:p-8 flex flex-col items-center text-center shadow-lg hover:shadow-2xl transition hover:border-emerald-200 transform hover:-translate-y-2 group opacity-0 translate-y-4';
          card.setAttribute('data-nombre', member.name); // Para el buscador

          // Imagen o Inicial
          let imgHtml = '';
          if (member.profile_image) {
            imgHtml = `<img src="${member.profile_image}" alt="${member.name}" class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover mb-6 ring-4 ring-emerald-50 group-hover:ring-emerald-200 transition-all shadow-md bg-gray-100 group-hover:scale-105">`;
          } else {
            imgHtml = `
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-6 ring-4 ring-emerald-50 group-hover:ring-emerald-200 transition-all shadow-md group-hover:scale-105">
                    <span class="text-3xl font-black opacity-80">${firstLetter}</span>
                </div>`;
          }

          card.innerHTML = `
                ${imgHtml}
                <h3 class="text-lg md:text-xl font-bold text-slate-800 group-hover:text-emerald-700 transition-colors leading-snug mb-3">${member.name}</h3>
                <p class="text-[10px] md:text-xs text-emerald-700 font-bold bg-emerald-50 px-4 py-1.5 rounded-full uppercase tracking-widest border border-emerald-100/50 flex items-center justify-center gap-1.5 shadow-inner">
                    <i class="fas fa-store text-[9px] opacity-70"></i> Socio 
                </p>
                
                <!-- Hover Hint (Flecha sutil abajo) -->
                <div class="mt-6 opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0 text-slate-300 group-hover:text-emerald-500">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            `;

          grid.appendChild(card);

          // Animar entrada escalonada
          setTimeout(() => {
            card.classList.remove('opacity-0', 'translate-y-4');
          }, index * 50); // Delay más rápido para que no tarde tanto
        });

      } catch (err) {
        console.error('Error:', err);
        grid.innerHTML = '<div class="col-span-full text-center text-red-500">Error al cargar los socios. Por favor intente más tarde.<br>' + err.message + '</div>';
      }
    }

    // Expose search filter globally
    window.filtrarSocios = function () {
      const input = document.getElementById('buscadorSocios');
      const filter = input.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const cards = document.getElementsByClassName('tarjeta-socio');

      for (let i = 0; i < cards.length; i++) {
        const name = cards[i].getAttribute('data-nombre').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (name.includes(filter)) {
          cards[i].style.display = "";
        } else {
          cards[i].style.display = "none";
        }
      }
    }

    // Init
    fetchAndRenderSocios();
  </script>

</body>

</html>
