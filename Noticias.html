<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias y Novedades - Feria Agrícola Melipilla</title>
  <meta name="description"
    content="Mantente informado con las últimas noticias, eventos y comunicados de la Feria Agrícola Melipilla. Actualidad gremial y comunitaria.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="images/favicon.webp" type="image/x-icon">
  <meta name="theme-color" content="#166534">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#166534',
            secondary: '#65a30d',
            accent: '#f97316',
            dark: '#020617'
          },
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://kit.fontawesome.com/c38e3367c6.js" crossorigin="anonymous"></script>

  <!-- Layout Script -->
  <script src="js/layout.js"></script>

  <style>
    /* Forzar centrado de imágenes y videos en el contenido de la noticia */
    #modal-cuerpo img,
    #modal-cuerpo iframe,
    #modal-cuerpo video {
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
    }

    /* Ajustes para iframes (videos de youtube/blogger) */
    #modal-cuerpo iframe {
      width: 100%;
      aspect-ratio: 16/9;
      height: auto;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans no-header-padding">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 800, once: true, offset: 80 });
      renderLayout("Noticias");
    });
  </script>

  <!-- Header Placeholder -->
  <div id="main-header"></div>

  <!-- Hero Personalizado para Noticias (Imagen de Fondo) -->
  <div class="relative w-full pt-44 pb-20 md:pt-48 md:pb-32 bg-[#166534] overflow-hidden group">
    <!-- Background Image -->
    <div class="absolute inset-0">
      <img src="images/Banner_1.webp"
        class="w-full h-full object-cover opacity-60 group-hover:opacity-70 transition-opacity duration-1000 scale-105 group-hover:scale-100">
      <div class="absolute inset-0 bg-gradient-to-t from-[#166534] via-[#166534]/50 to-[#166534]/30"></div>
      <!-- Decorative Pattern -->
      <div class="absolute inset-0 opacity-10"
        style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M54.627 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM22.485 0l.83.828-1.415 1.415-.828-.828-.828.828-1.415-1.415.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 22.485l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 22.485l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM0 54.627l.828.83-1.415 1.415-.828-.828-.828.828L-1.415 54.627l.828-.828-.828-.828 1.415-1.415.828.828.828-.828 1.415 1.415-.828.828zM54.627 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828zM22.485 60l.83-.828-1.415-1.415-.828.828-.828-.828-1.415 1.415.828.828-.828.828 1.415 1.415.828-.828.828.828 1.415-1.415.828-.828z\' fill=\'%23ffffff\' fill-rule=\'evenodd\'/%3E%3C/svg%3E');">
      </div>
    </div>

    <div class="relative max-w-6xl mx-auto px-6 text-center z-10">
      <span
        class="inline-block py-1 px-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-emerald-200 text-xs font-bold uppercase tracking-widest mb-4 animate-fade-in-up">
        Actualidad & Comunicados
      </span>
      <h1 class="text-3xl md:text-6xl font-black text-white mb-4 md:mb-6 leading-tight drop-shadow-lg"
        data-aos="fade-up">
        Noticias de la Feria
      </h1>
      <p class="text-lg text-emerald-100 max-w-2xl mx-auto leading-relaxed" data-aos="fade-up" data-aos-delay="100">
        El espacio donde compartimos nuestros logros, eventos y avisos importantes para nuestros socios y la comunidad.
      </p>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16 min-h-[50vh]">
    <div id="grilla-noticias" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- SKELETON LOADERS: Se muestran mientras carga la data real -->
      <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 h-full animate-pulse">
        <div class="h-52 bg-slate-200"></div>
        <div class="p-6 space-y-4">
          <div class="h-4 bg-slate-200 rounded w-1/4"></div>
          <div class="h-6 bg-slate-200 rounded w-3/4"></div>
          <div class="space-y-2 pt-2">
            <div class="h-4 bg-slate-200 rounded"></div>
            <div class="h-4 bg-slate-200 rounded w-5/6"></div>
          </div>
        </div>
      </div>
      <div
        class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 h-full animate-pulse hidden md:block">
        <div class="h-52 bg-slate-200"></div>
        <div class="p-6 space-y-4">
          <div class="h-4 bg-slate-200 rounded w-1/4"></div>
          <div class="h-6 bg-slate-200 rounded w-3/4"></div>
          <div class="space-y-2 pt-2">
            <div class="h-4 bg-slate-200 rounded"></div>
            <div class="h-4 bg-slate-200 rounded w-5/6"></div>
          </div>
        </div>
      </div>
      <div
        class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100 h-full animate-pulse hidden lg:block">
        <div class="h-52 bg-slate-200"></div>
        <div class="p-6 space-y-4">
          <div class="h-4 bg-slate-200 rounded w-1/4"></div>
          <div class="h-6 bg-slate-200 rounded w-3/4"></div>
          <div class="space-y-2 pt-2">
            <div class="h-4 bg-slate-200 rounded"></div>
            <div class="h-4 bg-slate-200 rounded w-5/6"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="main-footer"></div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    window.noticiasData = [];

    // Función para obtener noticias de Supabase
    async function fetchNoticias() {
      const contenedor = document.getElementById('grilla-noticias');
      if (!contenedor) return;

      try {
        const { data: noticias, error } = await supabase
          .from('web_news')
          .select('*')
          .eq('is_published', true)
          .order('published_at', { ascending: false });

        if (error) throw error;

        if (!noticias || noticias.length === 0) {
          contenedor.innerHTML = '<div class="col-span-full text-center py-10 bg-white rounded-xl shadow text-slate-500">No hay noticias publicadas aún.</div>';
          return;
        }

        window.noticiasData = noticias;
        renderNoticias(noticias);

      } catch (err) {
        console.error('❌ Error Supabase:', err);
        contenedor.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Error al cargar noticias. Intente más tarde.</div>';
      }
    }

    function renderNoticias(lista) {
      const contenedor = document.getElementById('grilla-noticias');
      let html = '';

      lista.forEach((item) => {
        // Formato de fecha elegante (Ej: 05 ENE 2025)
        const dateObj = new Date(item.published_at);
        const dia = dateObj.toLocaleDateString('es-CL', { day: '2-digit' });
        const mes = dateObj.toLocaleDateString('es-CL', { month: 'short' }).toUpperCase().replace('.', '');

        const imagenUrl = item.image_url || "images/Banner_1.webp";

        // Generar resumen limpio (Strip HTML de todo)
        let rawSummary = item.summary || item.content || "";
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = rawSummary;
        
        // Quitar scripts y estilos para que no salga código en el resumen
        const scripts = tempDiv.querySelectorAll('script');
        scripts.forEach(s => s.remove());
        const styles = tempDiv.querySelectorAll('style');
        styles.forEach(s => s.remove());

        let cleanSummary = tempDiv.textContent || tempDiv.innerText || "";
        cleanSummary = cleanSummary.replace(/\s+/g, " ").trim();
        let resumen = cleanSummary.length > 140 ? cleanSummary.substring(0, 140) + "..." : cleanSummary;

        html += `
            <a href="detalle-noticia.html?id=${item.id}" class="group bg-white rounded-[2rem] shadow-sm hover:shadow-2xl transition-all duration-500 border border-slate-100 flex flex-col h-full overflow-hidden hover:-translate-y-2 cursor-pointer">
                
                <!-- Imagen con Overlay y Badge de Fecha -->
                <div class="relative h-64 overflow-hidden">
                    <img src="${imagenUrl}" alt="${item.title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 will-change-transform">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
                    
                    <!-- Badge Fecha Flotante -->
                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg flex flex-col items-center min-w-[60px] border border-white/50">
                        <span class="text-2xl font-bold text-slate-900 leading-none">${dia}</span>
                        <span class="text-[10px] font-bold text-primary tracking-widest uppercase">${mes}</span>
                    </div>
                </div>

                <!-- Contenido -->
                <div class="p-8 flex flex-col flex-grow relative">
                    <!-- Categoría (Visual) -->
                    <div class="mb-4">
                        <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-emerald-100">
                            Feria informa
                        </span>
                    </div>

                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 leading-tight group-hover:text-primary transition-colors">
                        ${item.title}
                    </h3>
                    
                    <p class="text-slate-500 text-sm leading-relaxed mb-6 line-clamp-3 font-medium">
                        ${resumen || ''}
                    </p>

                    <!-- Footer Card -->
                    <div class="pt-6 border-t border-slate-100 mt-auto flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-400 group-hover:text-primary transition-colors tracking-widest uppercase">Leer completa</span>
                        <div class="w-10 h-10 rounded-full bg-slate-50 group-hover:bg-primary text-slate-400 group-hover:text-white flex items-center justify-center transition-all shadow-sm group-hover:shadow-lg transform group-hover:rotate-[-45deg]">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </a>
          `;
      });
      contenedor.innerHTML = html;
    }

    // Iniciar carga
    fetchNoticias();

  </script>

</body>

</html>
