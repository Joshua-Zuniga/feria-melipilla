<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias - Feria Agrícola Melipilla</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="images/favicon.webp" type="image/x-icon">
  <meta name="theme-color" content="#166534">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#166534',
            secondary: '#65a30d',
            accent: '#f97316',
            dark: '#020617'
          },
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://kit.fontawesome.com/c38e3367c6.js" crossorigin="anonymous"></script>

  <!-- Layout Script -->
  <script src="js/layout.js"></script>

  <style>
    /* Forzar centrado de imágenes y videos en el contenido de la noticia */
    #modal-cuerpo img,
    #modal-cuerpo iframe,
    #modal-cuerpo video {
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
    }

    /* Ajustes para iframes (videos de youtube/blogger) */
    #modal-cuerpo iframe {
      width: 100%;
      aspect-ratio: 16/9;
      height: auto;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AOS.init({ duration: 800, once: true, offset: 80 });
      renderLayout("Noticias");
    });
  </script>

  <!-- Header Placeholder -->
  <div id="main-header"></div>

  <!-- Hero Personalizado para Noticias -->
  <div class="bg-primary text-white border-b border-emerald-700/80">
    <div class="max-w-6xl mx-auto px-4 py-10 md:py-14 flex items-center justify-between gap-6">
      <div class="space-y-3 md:space-y-4" data-aos="fade-right">
        <p class="text-xs md:text-sm font-semibold tracking-[0.25em] uppercase text-emerald-200">
          Actualidad
        </p>
        <h1 class="text-3xl md:text-4xl font-bold">Nuestras Noticias</h1>
        <p class="text-sm md:text-base text-emerald-100 max-w-xl">
          Infórmate de las últimas novedades, eventos y comunicados de la asociación.
        </p>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-12 md:py-16 space-y-16 min-h-[50vh]">
    <div id="grilla-noticias" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div class="col-span-full flex flex-col justify-center items-center py-20 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary mb-4"></i>
        <p>Cargando novedades...</p>
      </div>
    </div>
  </main>

  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-50 hidden transition-opacity opacity-0 backdrop-blur-sm"
    onclick="cerrarModal()"></div>
  <div id="modal-panel" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none hidden p-4">
    <div
      class="bg-white w-full max-w-4xl h-[90vh] rounded-2xl shadow-2xl relative transform transition-all scale-95 opacity-0 duration-300 pointer-events-auto"
      id="modal-content-box">
      <!-- Contenedor con Scroll Único para todo el modal -->
      <div class="h-full overflow-y-auto rounded-2xl custom-scrollbar">

        <!-- Banner / Header -->
        <div class="relative h-64 md:h-96 w-full">
          <button onclick="cerrarModal()"
            class="absolute top-4 right-4 bg-black/50 hover:bg-black/70 text-white rounded-full w-10 h-10 flex items-center justify-center z-20 transition-colors backdrop-blur-sm">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
          <img id="modal-img" src="" class="w-full h-full object-cover bg-slate-200">
          <div class="absolute bottom-4 left-4 z-10 w-full pr-8">
            <span id="modal-fecha"
              class="inline-block px-3 py-1 bg-secondary/90 text-white text-xs font-bold rounded-full shadow-lg uppercase tracking-wider backdrop-blur-sm"></span>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"></div>
        </div>

        <!-- Contenido -->
        <div class="p-6 md:p-10 bg-white">
          <h2 id="modal-titulo"
            class="text-2xl md:text-4xl font-bold text-slate-800 mb-6 leading-tight border-b border-slate-100 pb-4">
          </h2>
          <div id="modal-cuerpo" class="prose prose-green prose-lg max-w-none text-slate-700 font-sans"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="main-footer"></div>

  <script>
    // --- Lógica Noticias ---
    let noticiasData = [];

    // Función para limpiar estilos y etiquetas globales que rompen el sitio
    function limpiarContenido(html) {
      if (!html) return "";
      let c = html;
      // Eliminar bloques de style y script completos
      c = c.replace(/<style\b[^>]*>([\s\S]*?)<\/style>/gim, "");
      c = c.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gim, "");
      // Eliminar etiquetas estructurales pero mantener contenido
      c = c.replace(/<head\b[^>]*>([\s\S]*?)<\/head>/gim, "");
      c = c.replace(/<\/?(html|body|iframe|!DOCTYPE)[^>]*>/gim, (match) => {
        // Mantenemos iframes porque pueden ser videos
        if (match.toLowerCase().includes('iframe')) return match;
        return "";
      });
      return c;
    }

    function cargarNoticias(json) {
      var html = '';
      var entradas = json.feed.entry;
      var contenedor = document.getElementById('grilla-noticias');

      if (!entradas) {
        contenedor.innerHTML = '<div class="col-span-full text-center p-10 bg-white rounded-xl shadow"><p class="text-slate-500">No hay noticias publicadas.</p></div>';
        return;
      }

      noticiasData = entradas;

      for (var i = 0; i < entradas.length; i++) {
        var entrada = entradas[i];
        var titulo = entrada.title.$t;
        var contenidoRaw = entrada.content.$t;
        var fecha = new Date(entrada.published.$t).toLocaleDateString('es-CL', { year: 'numeric', month: 'long', day: 'numeric' });

        // Usamos una imagen de tu carpeta como fallback si no hay en el post
        var imagenUrl = "images/Banner_1.webp";
        if (entrada.media$thumbnail) {
          imagenUrl = entrada.media$thumbnail.url.replace(/\/s[0-9]+.*?\//, "/w600-h400-c/");
        }

        // Resumen (usando versión limpia)
        var contenidoLimpio = limpiarContenido(contenidoRaw);
        var divTemporal = document.createElement("div");
        divTemporal.innerHTML = contenidoLimpio;
        var textoPlano = divTemporal.innerText || "";
        var resumen = textoPlano.length > 120 ? textoPlano.substring(0, 120) + "..." : textoPlano;

        html += `
            <article class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col h-full group cursor-pointer" onclick="abrirModal(${i})">
                <div class="relative h-52 overflow-hidden">
                    <div class="absolute top-3 left-3 bg-primary/90 text-white text-xs font-bold px-3 py-1 rounded-md z-10 shadow-sm">
                        ${fecha}
                    </div>
                    <img src="${imagenUrl}" alt="${titulo}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
                </div>
                <div class="p-6 flex flex-col flex-grow">
                    <h3 class="text-xl font-bold text-slate-800 mb-3 leading-tight group-hover:text-primary transition-colors">${titulo}</h3>
                    <p class="text-slate-600 text-sm mb-4 flex-grow leading-relaxed">${resumen}</p>
                    <div class="pt-4 border-t border-slate-100 mt-auto flex items-center text-primary font-semibold text-sm">
                        Leer artículo 
                        <i class="fa-solid fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            </article>
            `;
      }
      contenedor.innerHTML = html;
    }

    // --- Lógica Modal ---
    const backdrop = document.getElementById('modal-backdrop');
    const modalPanel = document.getElementById('modal-panel');
    const modalBox = document.getElementById('modal-content-box');

    function abrirModal(index) {
      var data = noticiasData[index];
      var imgAlta = "images/Banner_1.webp"; // Fallback
      if (data.media$thumbnail) {
        // Usamos una resolución un poco mejor, 1000px ancho
        imgAlta = data.media$thumbnail.url.replace(/\/s[0-9]+.*?\//, "/w1000-h500-c/");
      }
      var fecha = new Date(data.published.$t).toLocaleDateString('es-CL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      // Limpiar contenido antes de mostrar
      var contenidoLimpio = limpiarContenido(data.content.$t);

      document.getElementById('modal-titulo').innerText = data.title.$t;
      document.getElementById('modal-cuerpo').innerHTML = contenidoLimpio;
      document.getElementById('modal-img').src = imgAlta;
      document.getElementById('modal-fecha').innerText = fecha;

      // Corregir imágenes dentro del post para que no se salgan
      var imgs = document.getElementById('modal-cuerpo').getElementsByTagName('img');
      for (var img of imgs) { img.style.maxWidth = "100%"; img.style.height = "auto"; }

      backdrop.classList.remove('hidden');
      modalPanel.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        modalBox.classList.remove('scale-95', 'opacity-0');
        modalBox.classList.add('scale-100', 'opacity-100');
      }, 10);
      document.body.style.overflow = 'hidden';
    }

    function cerrarModal() {
      backdrop.classList.add('opacity-0');
      modalBox.classList.remove('scale-100', 'opacity-100');
      modalBox.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
        modalPanel.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }, 300);
    }

    document.addEventListener('keydown', (e) => { if (e.key === "Escape") cerrarModal(); });
  </script>

  <script
    src="https://feriaagricolamelipilla.blogspot.com/feeds/posts/default?alt=json-in-script&callback=cargarNoticias&max-results=12"></script>

</body>

</html>
